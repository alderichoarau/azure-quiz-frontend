# -----------------------------------------------------------------------------------------------
# SCA (Software Composition Analysis): looks for known CVEs in third-party dependencies.
# Complements dependency-review.yml (diffs only new PR deps) and Dependabot (background
# monitoring) by checking the *current* lockfile every run, via two scanners:
#   - npm audit -- npm's own advisory database
#   - Trivy     -- broader/faster DB, reads package-lock.json directly, no install needed
#
# Also generates compliance artifacts (production deps only, devDependencies excluded):
#   - license-scan -- flags non-permissive licenses, informational only until there's a policy
#   - sbom         -- CycloneDX inventory, uploaded as a build artifact
# -----------------------------------------------------------------------------------------------
name: "Security (SCA) - Dependency Vulnerability Scan"
run-name: Security (SCA) - Run Dependency Vulnerability Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: "npm audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node and install deps"
        uses: alderichoarau/gha-actions/setup-node@setup-node-v1

      - name: "Audit dependencies (high & critical)"
        shell: bash
        run: |
          set +e
          npm run security:audit 2>&1 | tee npm-audit.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "## 📦 npm audit"
            echo '```'
            cat npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  trivy-vuln:
    name: "Trivy (dependency vulnerabilities)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan dependencies for known CVEs (trivy)"
        uses: alderichoarau/gha-actions/trivy-scan@trivy-scan-v1
        with:
          scan-type: fs
          scanners: vuln
          heading: "Dependency Vulnerabilities"

  license-scan:
    name: "Trivy (license compliance)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      # exit-code "0" (informational only) -- no explicit allow/deny license policy yet.
      - name: "Scan dependency licenses (trivy)"
        uses: alderichoarau/gha-actions/trivy-scan@trivy-scan-v1
        with:
          scan-type: fs
          scanners: license
          exit-code: "0"
          icon: "📄"
          heading: "License Compliance"

  sbom:
    name: "Generate SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Generate SBOM (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          hide-progress: true
          output: sbom.cdx.json

      - name: "Upload SBOM artifact"
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: "Publish summary"
        run: |
          {
            echo "## 📋 SBOM (CycloneDX)"
            echo "- Components: $(jq '.components | length' sbom.cdx.json)"
            echo "- Spec version: $(jq -r '.specVersion' sbom.cdx.json)"
            echo "- Download the full SBOM from this run's **Summary** page, under **Artifacts** (\`sbom\`)."
          } >> "$GITHUB_STEP_SUMMARY"
