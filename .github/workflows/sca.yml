# -----------------------------------------------------------------------------------------------
# SCA (Software Composition Analysis): looks for known CVEs in third-party dependencies.
# Complements dependency-review.yml (which only diffs *new* deps introduced by a PR) and
# Dependabot (continuous background monitoring) by checking the *current* lockfile on every run,
# via two independent scanners:
#   - npm audit          -- npm's own advisory database
#   - Trivy (vuln, fs)   -- reads package-lock.json directly (no install needed), broader/faster
#     vulnerability DB, same tool already used for secrets/container scanning in this repo.
#
# Also generates two compliance/inventory artifacts, both scoped to production `dependencies`
# only (Trivy suppresses devDependencies by default, matching what actually ships in the bundle):
#   - license-scan -- flags non-permissive licenses. Informational only (no exit-code set, so it
#     never blocks a merge) until there's an explicit allow/deny policy to enforce against.
#   - sbom         -- CycloneDX component inventory, uploaded as a build artifact.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (SCA): Dependency Vulnerability Scan"
run-name: Security (SCA) - Dependency Vulnerability Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: "npm audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Audit dependencies (high & critical)"
        shell: bash
        run: |
          set +e
          npm run security:audit 2>&1 | tee npm-audit.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "## 📦 npm audit"
            echo '```'
            cat npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  trivy-vuln:
    name: "Trivy (dependency vulnerabilities)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan dependencies for known CVEs (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          hide-progress: true
          output: trivy-sca.txt

      - name: "Publish results to job summary"
        if: always()
        run: |
          if [ -s trivy-sca.txt ]; then
            {
              echo "## 🛡️ Trivy — Dependency Vulnerabilities"
              echo '```'
              cat trivy-sca.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-scan:
    name: "Trivy (license compliance)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan dependency licenses (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: license
          hide-progress: true
          output: trivy-license.txt
          # No exit-code set (defaults to 0) -- informational, doesn't block
          # merges. Flip this once there's an explicit allow/deny license
          # policy to actually enforce.

      - name: "Publish results to job summary"
        if: always()
        run: |
          if [ -s trivy-license.txt ]; then
            {
              echo "## 📄 Trivy — License Compliance"
              echo '```'
              cat trivy-license.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sbom:
    name: "Generate SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Generate SBOM (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          hide-progress: true
          output: sbom.cdx.json

      - name: "Upload SBOM artifact"
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: "Publish summary"
        run: |
          {
            echo "## 📋 SBOM (CycloneDX)"
            echo "- Components: $(jq '.components | length' sbom.cdx.json)"
            echo "- Spec version: $(jq -r '.specVersion' sbom.cdx.json)"
            echo "- Download the full SBOM from this run's **Summary** page, under **Artifacts** (\`sbom\`)."
          } >> "$GITHUB_STEP_SUMMARY"
