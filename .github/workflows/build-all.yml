# -----------------------------------------------------------------------------------------------
# This workflow built the project on every pull request and on every manual trigger.
# This workflow is used in pull request as a required check.
# -----------------------------------------------------------------------------------------------
name: GitHub - Build all
run-name: Build all modules

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Check lint"
        run: npm run lint

      - name: "Run test"
        run: npm run test:coverage

      - name: "Build project"
        run: npm run build
