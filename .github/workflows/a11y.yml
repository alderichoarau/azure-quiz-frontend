# -----------------------------------------------------------------------------------------------
# Accessibility audit (not a security scan, but grouped with the others as a quality gate): runs
# axe-core against the production build's landing route. Only the root route ("/") is audited --
# the other routes (certifications, quiz, admin/*) depend on a live backend that doesn't exist in
# CI, so they'd only render loading/error states here.
#
# Manual dispatch accepts an optional `target_url` to audit an arbitrary deployed URL (e.g. a
# staging/preview environment) instead of building and serving the app locally -- useful to cover
# routes that need a live backend, which the default local-build run can't reach.
# -----------------------------------------------------------------------------------------------
name: "Accessibility - axe-core Audit"
run-name: Accessibility - Run axe-core Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to audit instead of building/serving locally (e.g. https://staging.example.com/quiz)"
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y:
    name: "Accessibility audit (axe-core)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Node and install deps"
        uses: alderichoarau/gha-setup-node@v1

      - name: "Build Angular app"
        if: ${{ !inputs.target_url }}
        run: npm run build:prod

      - name: "Serve production build"
        if: ${{ !inputs.target_url }}
        run: npx http-server dist/azure-quiz-frontend/browser -p 4200 --silent &

      - name: "Determine scan target"
        id: target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://localhost:4200" >> "$GITHUB_OUTPUT"
          fi

      - name: "Wait for server to be ready"
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ steps.target.outputs.url }}" > /dev/null && exit 0
            sleep 1
          done
          echo "Server never became ready" >&2
          exit 1

      - name: "Run axe-core accessibility audit"
        uses: alderichoarau/gha-setup-chrome-axe@v1
        with:
          target-url: ${{ steps.target.outputs.url }}
