# -----------------------------------------------------------------------------------------------
# DAST (Dynamic Application Security Testing): attacks the *running* app from the outside, unlike
# every other scan here which only reads source/config. Runs OWASP ZAP's baseline scan (passive
# only) against the production build served locally.
#
# Signal is limited: no live backend in CI, so this mostly checks headers/passive page behavior,
# not real business logic.
#
# KNOWN GAP: served via `http-server` on the raw `ng build` output, not the real nginx image --
# ZAP will permanently flag missing security headers here even though nginx.conf/
# staticwebapp.config.json already set them for real deployments. Building+running the actual
# Docker image (like container.yml) would close this, at the cost of a slower job; left as-is.
#
# Runs on push to main + manual dispatch only, not on every PR: the slowest job in the suite, and
# its value pre-deploy is marginal. Add `pull_request` if you want this signal pre-merge.
#
# fail_action/allow_issue_writing off: baseline scans are informational by default -- review the
# "zap_scan" artifact instead. Flip fail_action once the report's been clean a few times.
# -----------------------------------------------------------------------------------------------
name: "Security (DAST) - OWASP ZAP Baseline Scan"
run-name: Security (DAST) - Run OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "OWASP ZAP baseline scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Build Angular app"
        run: npm run build:prod

      - name: "Serve production build"
        run: npx http-server dist/azure-quiz-frontend/browser -p 4200 --silent &

      - name: "Wait for server to be ready"
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 1
          done
          echo "Server never became ready" >&2
          exit 1

      - name: "Run ZAP baseline scan"
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:4200"
          fail_action: false
          allow_issue_writing: false
          # No cmd_options: this action already writes report_html.html/report_md.md/
          # report_json.json by default. Renaming them via -r/-w/-J broke the artifact-upload
          # step -- hit live ("report_md.md does not exist").

      - name: "Publish alert summary to job summary"
        if: always()
        run: |
          if [ ! -f report_md.md ]; then
            echo "⚠️ report_md.md not found -- ZAP markdown report wasn't generated (check the 'Run ZAP baseline scan' step above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🔍 OWASP ZAP Baseline — Summary of Alerts"
            echo
            # Slice out the "Summary of Alerts" section -- everything up to the next level-2
            # heading (e.g. "## Alert Detail").
            SUMMARY=$(awk '
              /^## Summary of Alerts/ { found=1 }
              found && /^## / && !/^## Summary of Alerts/ { exit }
              found { print }
            ' report_md.md)

            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_Could not locate a \"Summary of Alerts\" section in the report -- see the full report below._"
            fi

            echo
            echo "<details><summary>Full ZAP report (Markdown)</summary>"
            echo
            cat report_md.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
