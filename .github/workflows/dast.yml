# -----------------------------------------------------------------------------------------------
# DAST (Dynamic Application Security Testing): attacks the *running* app from the outside, unlike
# every other scan in this repo which reads source/config without executing it. Runs OWASP ZAP's
# baseline scan (passive checks only -- no active/aggressive attack payloads) against the
# production build served locally.
#
# Signal is intentionally limited here: there's no live backend in CI, so this mostly checks
# response/security headers and passive page checks on the static bundle nginx would serve, not
# real business-logic surfaces (those need a deployed nonprod environment to test against
# meaningfully -- worth revisiting once one is reliably reachable from CI).
#
# Runs on push to main + manual dispatch only, not on every PR: a full ZAP baseline pass (image
# pull + scan) is the slowest job of the security suite, and its value on a not-yet-deployed
# branch is marginal. Switch to `pull_request` triggers too if you'd rather get this signal
# pre-merge.
#
# fail_action / allow_issue_writing are both explicitly off -- baseline scans are informational by
# default (avoids blocking merges or filing an issue on every run); review the uploaded
# "zap_scan" artifact instead. Flip fail_action to true once the report's been reviewed a few
# times and looks clean, to make this a real gate.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (DAST): OWASP ZAP Baseline Scan"
run-name: Security (DAST) - OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "OWASP ZAP baseline scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Build Angular app"
        run: npm run build:prod

      - name: "Serve production build"
        run: npx http-server dist/azure-quiz-frontend/browser -p 4200 --silent &

      - name: "Wait for server to be ready"
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 1
          done
          echo "Server never became ready" >&2
          exit 1

      - name: "Run ZAP baseline scan"
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:4200"
          fail_action: false
          allow_issue_writing: false
