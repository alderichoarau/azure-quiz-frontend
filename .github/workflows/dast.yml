# -----------------------------------------------------------------------------------------------
# DAST (Dynamic Application Security Testing): attacks the *running* app from the outside, unlike
# every other scan in this repo which reads source/config without executing it. Runs OWASP ZAP's
# baseline scan (passive checks only -- no active/aggressive attack payloads) against the
# production build served locally.
#
# Signal is intentionally limited here: there's no live backend in CI, so this mostly checks
# response/security headers and passive page checks on the static bundle nginx would serve, not
# real business-logic surfaces (those need a deployed nonprod environment to test against
# meaningfully -- worth revisiting once one is reliably reachable from CI).
#
# KNOWN GAP: the target below is served by `http-server` directly on the raw `ng build` output,
# not through the actual nginx image (Dockerfile/nginx.conf). This is faster/simpler but means ZAP
# will permanently flag missing security headers (clickjacking, X-Content-Type-Options, CSP,
# Permissions-Policy) here even though nginx.conf and staticwebapp.config.json both already set
# them for the real deployments -- a known false signal, not a real gap in prod. Switching this job
# to build+run the actual Docker image (like container.yml's image-scan job) would close it, at
# the cost of a slower job; deliberately left as-is for now.
#
# Runs on push to main + manual dispatch only, not on every PR: a full ZAP baseline pass (image
# pull + scan) is the slowest job of the security suite, and its value on a not-yet-deployed
# branch is marginal. Switch to `pull_request` triggers too if you'd rather get this signal
# pre-merge.
#
# fail_action / allow_issue_writing are both explicitly off -- baseline scans are informational by
# default (avoids blocking merges or filing an issue on every run); review the uploaded
# "zap_scan" artifact instead. Flip fail_action to true once the report's been reviewed a few
# times and looks clean, to make this a real gate.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (DAST): OWASP ZAP Baseline Scan"
run-name: Security (DAST) - OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "OWASP ZAP baseline scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Build Angular app"
        run: npm run build:prod

      - name: "Serve production build"
        run: npx http-server dist/azure-quiz-frontend/browser -p 4200 --silent &

      - name: "Wait for server to be ready"
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 1
          done
          echo "Server never became ready" >&2
          exit 1

      - name: "Run ZAP baseline scan"
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:4200"
          fail_action: false
          allow_issue_writing: false
          # No cmd_options here: the action already writes report_html.html /
          # report_md.md / report_json.json by default. Overriding those names
          # via -r/-w/-J broke the action's own finalize/artifact-upload step,
          # which looks for these exact default filenames regardless of what
          # cmd_options requests -- hit live ("report_md.md does not exist").

      - name: "Publish alert summary to job summary"
        if: always()
        run: |
          if [ ! -f report_md.md ]; then
            echo "⚠️ report_md.md not found -- ZAP markdown report wasn't generated (check the 'Run ZAP baseline scan' step above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🔍 OWASP ZAP Baseline — Summary of Alerts"
            echo
            # Slice out just the "Summary of Alerts" section (a heading + its
            # table) from the full report -- everything up to the next
            # level-2 heading (e.g. "## Alert Detail").
            SUMMARY=$(awk '
              /^## Summary of Alerts/ { found=1 }
              found && /^## / && !/^## Summary of Alerts/ { exit }
              found { print }
            ' report_md.md)

            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_Could not locate a \"Summary of Alerts\" section in the report -- see the full report below._"
            fi

            echo
            echo "<details><summary>Full ZAP report (Markdown)</summary>"
            echo
            cat report_md.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
