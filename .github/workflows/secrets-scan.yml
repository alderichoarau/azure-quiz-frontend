# -----------------------------------------------------------------------------------------------
# Secrets scanning: catches API keys/tokens committed by mistake, in the diff and past history.
# Complements (doesn't replace) GitHub's native secret scanning if enabled at org level.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (Secrets): Gitleaks Scan"
run-name: Security (Secrets) - Gitleaks Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Scan for leaked secrets"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks can scan past commits too

      - name: "Scan for leaked secrets (gitleaks)"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
