# -----------------------------------------------------------------------------------------------
# GitHub Action to run SonarCloud analysis on the codebase.
# Automated and required for pull requests (PRs).
# -----------------------------------------------------------------------------------------------
name: "Security (SAST) - SonarCloud Analysis"
run-name: Security (SAST) - Run SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  sonar-scan:
    name: Sonar scan
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Node and install deps"
        uses: alderichoarau/gha-setup-node@v1

      - name: "Generate coverage report"
        run: npm run test:coverage

      - name: "SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
