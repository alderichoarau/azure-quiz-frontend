# -----------------------------------------------------------------------------------------------
# After anything merges into main, updates every other open PR branch with that new main (the
# same thing the "Update branch" button in the PR UI does, just automatic). A PR with a real
# conflict is left alone -- the update-branch call fails for that one PR only, and it gets a
# comment flagging it for a manual rebase, rather than silently sitting stale with no one noticing.
# The "already up to date" case (same failing HTTP status, different message) is not a conflict
# and is not commented on.
#
# Dependabot PRs are skipped by the update-branch call above -- Dependabot manages and rebases its
# own branches itself; having this also push commits onto them fights with that instead of
# helping. Instead, they get a "@dependabot rebase" comment: Dependabot's own listener acts on it
# regardless of who posts it, so this achieves the same "keep it current with main" outcome
# through Dependabot's own mechanism rather than the update-branch API.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Auto-update PR branches"
run-name: "Auto-update PR branches after merge to main"

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: "Update each open PR branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --base main --json number,author \
            --jq '.[] | select((.author.login | contains("dependabot")) | not) | .number' | while IFS= read -r pr; do
            echo "PR #$pr: updating..."
            if RESPONSE=$(gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" 2>&1); then
              echo "PR #$pr: updated"
            elif echo "$RESPONSE" | grep -qi "no new commits"; then
              echo "PR #$pr: already up to date"
            else
              echo "PR #$pr: could not update -- likely a real conflict, flagging for manual rebase"
              gh pr comment "$pr" --repo "$REPO" \
                --body "⚠️ Impossible de mettre à jour automatiquement cette branche avec \`main\` (probable conflit) — un rebase manuel est nécessaire."
            fi
          done

      - name: "Rebase Dependabot PR branches"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --base main --json number,author \
            --jq '.[] | select(.author.login | contains("dependabot")) | .number' | while IFS= read -r pr; do
            echo "PR #$pr: requesting @dependabot rebase"
            gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
          done
