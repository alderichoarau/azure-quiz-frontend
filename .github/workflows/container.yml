# -----------------------------------------------------------------------------------------------
# Container & IaC security: this repo (unlike a plain static site) ships a real Dockerfile + Helm
# chart (AKS track, see aks-deploy.yml), so both the infra-as-code definitions and the built image
# itself are worth scanning:
#   - iac-misconfig -- Trivy's misconfig scanner over Dockerfile / helm/ / nginx.conf (bad
#     practices: running as root, missing resource limits, permissive defaults, ...)
#   - image-scan    -- builds the image exactly like aks-deploy.yml does, then scans it (OS
#     packages + baked-in npm deps) for known CVEs. Build args below are dummy placeholders used
#     only to make the image buildable for scanning -- never deployed, no real secret involved.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (Container & IaC): Trivy Scan"
run-name: Security (Container & IaC) - Trivy Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-misconfig:
    name: "Trivy (Dockerfile / Helm / nginx misconfig)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan IaC for misconfigurations (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

  image-scan:
    name: "Trivy (built image CVEs)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Build image (dummy build args, scan-only)"
        run: |
          docker build \
            --build-arg API_BASE_URL="https://example.invalid/api" \
            --build-arg API_KEY="ci-scan-placeholder" \
            -t quiz-frontend:ci-scan .

      - name: "Scan image for known CVEs (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: quiz-frontend:ci-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
