# -----------------------------------------------------------------------------------------------
# Container & IaC: this repo (unlike a plain static site) ships a Dockerfile + Helm chart (AKS
# track), so both the IaC definitions and the built image are worth scanning:
#   - iac-misconfig -- Trivy's misconfig scanner over Dockerfile/helm/nginx.conf
#   - image-scan    -- builds the image like aks-deploy.yml, scans it (OS + npm deps) for CVEs.
#     Build args are dummy placeholders just to make the image buildable -- never deployed.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (Container & IaC): Trivy Scan"
run-name: Security (Container & IaC) - Trivy Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-misconfig:
    name: "Trivy (Dockerfile / Helm / nginx misconfig)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan IaC for misconfigurations (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          hide-progress: true
          output: trivy-iac.txt

      - name: "Publish results to job summary"
        if: always()
        run: |
          if [ -s trivy-iac.txt ]; then
            {
              echo "## 🛡️ Trivy — Dockerfile / Helm / nginx Misconfigurations"
              echo '```'
              cat trivy-iac.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  image-scan:
    name: "Trivy (built image CVEs)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Build image (dummy build args, scan-only)"
        run: |
          docker build \
            --build-arg API_BASE_URL="https://example.invalid/api" \
            --build-arg API_KEY="ci-scan-placeholder" \
            -t quiz-frontend:ci-scan .

      - name: "Scan image for known CVEs (trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: quiz-frontend:ci-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          hide-progress: true
          output: trivy-image.txt

      - name: "Publish results to job summary"
        if: always()
        run: |
          if [ -s trivy-image.txt ]; then
            {
              echo "## 🛡️ Trivy — Built Image CVEs"
              echo '```'
              cat trivy-image.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
