version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # Minor/patch updates are usually safe, bundle them into one PR
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Major updates can be breaking, keep them as individual PRs for review

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "ci"
    labels:
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - '*'
