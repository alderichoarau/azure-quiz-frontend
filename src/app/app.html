<header>
  <mat-toolbar color="primary" class="toolbar">
    <a routerLink="/" class="toolbar-title">
      <mat-icon>school</mat-icon>
      {{ 'app.title' | translate }}
      <span class="version">v{{ version }}</span>
    </a>
    <span class="spacer"></span>
    <button mat-button (click)="switchLang('fr')">FR</button>
    <button mat-button (click)="switchLang('en')">EN</button>
  </mat-toolbar>
</header>

<main class="content" [class.content-wide]="isAdminRoute()">
  <router-outlet />
</main>
