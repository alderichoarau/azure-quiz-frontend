sonar.projectKey=alderichoarau_azure-quiz-frontend
sonar.organization=alderichoarau

# Sources
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/*.spec.ts,\
  **/coverage/**,\
  **/dist/**,\
  **/docs/**,\
  **/*.config.ts,\
  **/test-setup.ts,\
  **/environments/**,\
  **/main.ts

# Coverage — generated by Vitest (lcov format), run through Angular's
# @angular/build:unit-test builder (ng test --coverage) rather than a bare
# `vitest run --coverage` -- that builder defaults reportsDirectory to
# coverage/<project-name> (angular.json's project name, "azure-quiz-frontend"),
# not plain coverage/ like a standalone vitest.config.ts would. Pointing this
# at coverage/lcov.info (the plain-Vitest default) meant the file never
# existed at that path -- SonarCloud silently showed 0% coverage instead of
# erroring, hit live.
sonar.javascript.lcov.reportPaths=coverage/azure-quiz-frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/azure-quiz-frontend/lcov.info

# Language
sonar.sourceEncoding=UTF-8
