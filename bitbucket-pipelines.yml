# -----------------------------------------------------------------------------------------------
# CI only (no CD) -- lean subset of the checks from .github/workflows/build-all.yml. Deployment
# (AKS/SWA) stays on GitHub. Scoped to "main" only (not every branch) and skips accessibility/
# security tooling to stay well within Bitbucket's free-tier 50 build-minutes/month.
# -----------------------------------------------------------------------------------------------
image: node:26

pipelines:
  branches:
    main:
      - step:
          name: Lint, Test & Build
          caches:
            - node
          script:
            - npm ci
            - npm run lint
            - npm run test:coverage
            - npm run build
          artifacts:
            - dist/**
            - coverage/**
