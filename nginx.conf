server {
    # 8080, not 80 -- the Deployment runs this container as a non-root user
    # (runAsUser: 101, deployment.yaml), which can't bind a port below 1024.
    # The k8s Service still exposes port 80 externally (service.yaml),
    # forwarding to this container port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server level -- /healthz repeats them, see NOTE there: nginx does NOT
    # inherit add_header into a location that sets its own, confirmed live with curl -I).
    #
    # connect-src is broad (https:) since the API origin differs per deploy track/environment
    # (*.azurewebsites.net / *.nip.io) and isn't known at build time -- tighten if it stabilizes.
    # style-src needs 'unsafe-inline': Angular injects <style> tags at runtime per component
    # (ViewEncapsulation); a nonce-based CSP would need extra plumbing (ngCspNonce) not set up here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # SPA fallback: any path Angular's router owns (not a real file on disk)
    # must still serve index.html, or a hard refresh on e.g. /quiz/123 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actuator-equivalent for this image -- AKS's readiness/liveness probes
    # (helm/templates/deployment.yaml) hit this instead of parsing the SPA.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        # Repeated from server level -- see NOTE above.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }
}
