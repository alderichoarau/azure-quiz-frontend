server {
    # 8080, not 80 -- the Deployment runs this container as a non-root user
    # (runAsUser: 101, deployment.yaml), which can't bind a port below 1024.
    # The k8s Service still exposes port 80 externally (service.yaml),
    # forwarding to this container port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers, set at server level for the "/" location below.
    #
    # NOTE: nginx does NOT inherit add_header into a location that defines
    # its own (e.g. /healthz's Content-Type below) -- these are repeated
    # there explicitly for that reason; confirmed live (curl -I), don't
    # assume inheritance if either location changes.
    #
    # connect-src is intentionally broad (https:) rather than pinned to one
    # backend host: the API origin differs per deploy track/environment
    # (*.azurewebsites.net for SWA, *.nip.io for AKS nonprod/prod, see
    # swa-deploy.yml / aks-deploy.yml) and isn't known when this static file
    # is built. Tighten it if/when the backend origin becomes stable.
    #
    # style-src needs 'unsafe-inline': Angular's per-component ViewEncapsulation
    # injects <style> tags into <head> at runtime (e.g. question-image.ts's
    # inline `styles:`), which a nonce/hash-based CSP would require extra
    # plumbing (ngCspNonce) to avoid -- not set up here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # SPA fallback: any path Angular's router owns (not a real file on disk)
    # must still serve index.html, or a hard refresh on e.g. /quiz/123 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actuator-equivalent for this image -- AKS's readiness/liveness probes
    # (helm/templates/deployment.yaml) hit this instead of parsing the SPA.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        # Repeated from server level -- see NOTE above.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }
}
